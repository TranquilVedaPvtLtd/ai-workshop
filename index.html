<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>मोफत AI कार्यशाळा — Jarvis Daily</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
  @font-face{font-family:'Noto Serif Devanagari';src:url('assets/fonts/NotoSerifDevanagari.woff2') format('woff2');font-weight:400 700;font-display:swap}
  @font-face{font-family:'Noto Sans Devanagari';src:url('assets/fonts/NotoSansDevanagari.woff2') format('woff2');font-weight:400 700;font-display:swap}
  :root{
    --cream:#F7F0E3; --cream-soft:#F2E8D8; --ink:#232946; --ink-soft:#5A5646;
    --accent:#D97B29; --accent-deep:#A85A17;
    --serif:'Noto Serif Devanagari',ui-serif,Georgia,serif;
    --sans:'Noto Sans Devanagari',-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--cream);overflow:hidden;
    font:16px/1.5 var(--sans);color:var(--ink)}
  #stage{position:fixed;inset:0;cursor:default}
  .layer{position:absolute;inset:0;transform-origin:50% 62%;
    animation:drift 18s ease-in-out infinite alternate;will-change:transform}
  @keyframes drift{from{transform:scale(1.004)}to{transform:scale(1.022)}}
  .still,.leg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    transition:opacity .6s ease}
  .leg{transition:opacity .14s linear}

  /* copy panel — lives in the art's upper-left negative space */
  .copy{position:absolute;top:9vh;left:5.5vw;width:44vw;max-width:720px;
    opacity:0;transform:translateY(10px);
    transition:opacity .22s ease,transform .22s ease;z-index:3}
  .copy.in{opacity:1;transform:translateY(0);transition:opacity .3s ease,transform .3s ease}
  .copy .chip,.copy h1,.copy p{opacity:0;transform:translateY(14px);
    transition:opacity .55s cubic-bezier(.16,1,.3,1),transform .55s cubic-bezier(.16,1,.3,1),
      filter .55s cubic-bezier(.16,1,.3,1)}
  .copy h1{filter:blur(6px)}
  .copy.in .chip{opacity:1;transform:none;transition-delay:.05s}
  .copy.in h1{opacity:1;transform:none;filter:blur(0);transition-delay:.12s}
  .copy.in p{opacity:1;transform:none;transition-delay:.22s}

  .copy .chip{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.1em;
    color:var(--accent-deep);border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);
    border-radius:100px;padding:6px 14px;margin-bottom:20px;background:rgba(255,252,245,.75)}
  .copy h1{font-family:var(--serif);font-weight:600;
    font-size:clamp(2.3rem,4.6vw,4rem);line-height:1.14;letter-spacing:-.01em;
    text-wrap:balance}
  .copy p{margin-top:16px;font-size:clamp(1.1rem,1.6vw,1.4rem);line-height:1.55;
    color:rgba(35,41,70,.8);max-width:38ch}
  .copy p.byline{margin-top:18px;font-size:14px;font-weight:600;letter-spacing:.08em;
    color:var(--accent-deep);max-width:none}

  /* receipt — folds open like paper */
  .receipt{margin-top:24px;display:inline-block;background:rgba(255,252,245,.92);
    border:1px solid #E2D5BE;border-radius:12px;padding:16px 20px;
    box-shadow:0 10px 30px rgba(35,41,70,.08);
    transform-origin:top center;transform:perspective(700px) rotateX(-58deg);opacity:0}
  .copy.in .receipt{opacity:1;transform:perspective(700px) rotateX(0);
    transition:transform .7s cubic-bezier(.3,1.25,.4,1) .3s,opacity .35s ease .3s}
  .receipt .r{font-size:15.5px;line-height:1.45;color:var(--ink-soft);padding:7px 0;
    border-bottom:1px dashed #E8DCC6;opacity:0;transition:opacity .4s ease}
  .copy.in .receipt .r{opacity:1}
  .copy.in .receipt .r:nth-child(1){transition-delay:.42s}
  .copy.in .receipt .r:nth-child(2){transition-delay:.52s}
  .copy.in .receipt .r:nth-child(3){transition-delay:.62s}
  .copy.in .receipt .r:nth-child(4){transition-delay:.72s}
  .copy.in .receipt .r:nth-child(5){transition-delay:.82s}
  .receipt .r:last-child{border-bottom:none}
  .receipt .r.gold{color:var(--accent-deep);font-weight:600}

  /* portal — a matted paper frame for demo videos / the welcome film (16:9) */
  .portal{position:absolute;right:5vw;top:50%;
    transform:translateY(-50%) translateX(36px) scale(.94);
    width:min(44vw,780px);aspect-ratio:16/9;border-radius:14px;overflow:hidden;
    border:1px solid color-mix(in srgb,var(--accent) 80%,transparent);
    box-shadow:0 0 0 7px rgba(255,252,245,.7),0 40px 90px rgba(35,41,70,.38);
    opacity:0;pointer-events:none;
    transition:opacity .45s ease,transform .65s cubic-bezier(.3,1.3,.45,1);background:#1D2233;z-index:3}
  .portal.show{opacity:1;transform:translateY(-50%) translateX(0) scale(1)}
  .portal.big{width:min(58vw,1000px)}
  .portal video{width:100%;height:100%;object-fit:cover;display:block}
  .portal .pcap{position:absolute;left:0;right:0;bottom:0;padding:12px 14px;
    font-size:13.5px;color:var(--cream);
    background:linear-gradient(transparent,rgba(29,34,51,.85));
    opacity:0;transition:opacity .4s ease .5s}
  .portal.show .pcap{opacity:1}
  .portal .replay{position:absolute;top:10px;right:10px;width:34px;height:34px;
    border:none;border-radius:50%;background:rgba(255,252,245,.85);color:var(--ink);
    font-size:16px;cursor:pointer;opacity:0;transition:opacity .3s}
  .portal.show .replay{opacity:.85}
  /* shown only when the browser refuses to autoplay a film that has sound */
  .portal.needs-tap::after{content:'\25B6';position:absolute;left:50%;top:50%;
    width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;
    background:rgba(255,252,245,.92);color:var(--ink);font-size:26px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 26px rgba(35,41,70,.28);pointer-events:none;
    animation:tapPulse 1.6s ease-in-out infinite}
  @keyframes tapPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

  /* finale QR card */
  .qrcard{display:flex;align-items:center;gap:18px;margin-top:24px;
    background:rgba(255,252,245,.94);border:1px solid #E2D5BE;border-radius:14px;
    padding:16px 20px;box-shadow:0 10px 30px rgba(35,41,70,.1);opacity:0;
    transform:translateY(14px);transition:opacity .5s ease .4s,transform .5s ease .4s;
    width:fit-content}
  .copy.in .qrcard{opacity:1;transform:none}
  .qrcard img{width:118px;height:118px;border-radius:8px}
  .qrcard .q1{font-family:var(--serif);font-weight:600;font-size:1.25rem}
  .qrcard .q2{font-size:.95rem;color:var(--ink-soft);margin-top:4px}
  .qrcard .q3{font-size:.95rem;font-weight:600;color:var(--accent-deep);margin-top:6px}

  /* progress rail */
  .rail{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:9px;z-index:4}
  .dot{width:8px;height:8px;border-radius:50%;background:rgba(35,41,70,.22);transition:all .3s}
  .dot:nth-child(5),.dot:nth-child(10),.dot:nth-child(12){margin-left:12px}
  .dot.done{background:color-mix(in srgb,var(--accent) 55%,transparent)}
  .dot.on{background:var(--accent);transform:scale(1.45)}

  .clock{position:absolute;left:26px;bottom:22px;font:600 13px ui-monospace,Menlo,monospace;
    color:rgba(35,41,70,.32);z-index:4}
  .clock.over{color:#B4543A}

  /* presenter cue — only when presenter mode (P) is on */
  .cue{position:absolute;left:26px;bottom:44px;max-width:380px;font-size:12.5px;
    font-style:italic;color:rgba(35,41,70,.5);display:none;z-index:4}
  body.presenting .cue{display:block}
  .wpnum{position:absolute;right:26px;bottom:44px;font:600 12px ui-monospace,Menlo,monospace;
    color:rgba(35,41,70,.4);display:none;z-index:4}
  body.presenting .wpnum{display:block}

  .help{position:absolute;right:26px;bottom:22px;max-width:360px;font-size:11.5px;
    color:rgba(35,41,70,.45);text-align:right;transition:opacity .3s;z-index:4}
  .help.hide{opacity:0}

  /* language toggle */
  .lang{position:absolute;top:20px;right:22px;z-index:5;border:1px solid #E2D5BE;
    background:rgba(255,252,245,.85);color:var(--ink-soft);border-radius:100px;
    font:600 12.5px var(--sans);padding:6px 14px;cursor:pointer;transition:all .25s}
  .lang:hover{color:var(--accent-deep);border-color:var(--accent)}

  @media (prefers-reduced-motion: reduce){
    .still,.leg,.copy,.copy .chip,.copy h1,.copy p,.receipt,.portal,.qrcard{transition:none}
    .layer{animation:none}
    .copy h1{filter:none}
  }

  /* ---------- mobile / portrait (audience link on phones) ---------- */
  @media (max-width: 820px) and (orientation: portrait){
    .still,.leg{object-position:66% 55%}
    #stage::before{content:'';position:absolute;inset:0 0 auto 0;height:54vh;z-index:1;
      pointer-events:none;
      background:linear-gradient(to bottom,var(--cream) 0%,rgba(247,240,227,.92) 26%,
        rgba(247,240,227,.55) 42%,transparent 62%)}
    .copy,.portal,.rail,.clock,.help{z-index:2}
    .copy{top:calc(env(safe-area-inset-top,0px) + 16px);left:6vw;width:88vw;max-width:none}
    .copy .chip{font-size:11px;padding:5px 12px;margin-bottom:12px}
    .copy h1{font-size:clamp(1.7rem,7.8vw,2.5rem);line-height:1.18}
    .copy p{margin-top:10px;font-size:1rem;max-width:none}
    .receipt{margin-top:14px;padding:12px 16px;border-radius:10px}
    .receipt .r{font-size:13px;padding:5px 0}
    .portal{right:50%;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 11vh);
      transform:translateX(50%) translateY(24px) scale(.94);
      width:min(88vw,420px)}
    .portal.show{transform:translateX(50%) translateY(0) scale(1)}
    .portal.big{width:min(88vw,420px)}
    .qrcard{gap:12px;padding:12px 14px}
    .qrcard img{width:88px;height:88px}
    .qrcard .q1{font-size:1.05rem}
    .rail{bottom:calc(env(safe-area-inset-bottom,0px) + 16px);gap:6px}
    .dot{width:6px;height:6px}
    .dot:nth-child(5),.dot:nth-child(10),.dot:nth-child(12){margin-left:8px}
    .clock,.cue,.wpnum{display:none !important}
    .help{right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
      max-width:200px;font-size:10.5px}
    .lang{top:calc(env(safe-area-inset-top,0px) + 10px);right:14px}
  }
</style>
</head>
<body>
<div id="stage"></div>
<script src="deck.js?v=4"></script>
<script src="presenter.js?v=4"></script>
</body>
</html>
